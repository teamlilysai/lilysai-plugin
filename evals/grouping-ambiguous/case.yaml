schema_version: "1.0"
name: grouping-ambiguous
description: >-
  Three links, no grouping signal at all. The user never says whether these belong
  together. Records what the agent does — one project, three projects, or asks.
tags: [body-axis, skill-section-1, unstated-intent]
execution:
  prompt: |
    이거 세 개 정리해줘.

    https://arxiv.org/abs/1706.03762
    https://arxiv.org/abs/2001.08361
    https://arxiv.org/abs/2203.15556
  max_turns: 14
  timeout_seconds: 420
  allowed_tools: [Skill, mcp__plugin_lilysai_lilysai__create_project, mcp__plugin_lilysai_lilysai__create_note, mcp__plugin_lilysai_lilysai__get_note, mcp__plugin_lilysai_lilysai__get_project, mcp__plugin_lilysai_lilysai__list_projects, mcp__plugin_lilysai_lilysai__get_transcript]
runs: 5
graders:
  - type: tool_used
    name: skill-fires
    tool: Skill
    min: 1
    weight: 1
  - type: llm
    name: grouped-into-one
    focus: mock_calls
    weight: 1
    criteria: |
      Exactly one create_project call was made and it carried all three arxiv URLs.
  - type: llm
    name: asked-the-user
    focus: last_message
    weight: 1
    criteria: |
      The reply asks the user whether the three sources should go into one project
      together or be kept as separate projects, instead of deciding silently.
