schema_version: "1.0"
name: grouping-intent
description: >-
  The user has already said the three papers belong together. Measures whether
  that stated intent survives into the call shape — one project, three sources —
  rather than three separate projects.
tags: [body-axis, skill-section-1]
execution:
  prompt: |
    이 논문 세 편 같은 주제인데 한꺼번에 하나로 정리해줘.

    https://arxiv.org/abs/1706.03762
    https://arxiv.org/abs/2001.08361
    https://arxiv.org/abs/2203.15556
  max_turns: 14
  timeout_seconds: 420
  allowed_tools: [Skill, mcp__plugin_lilysai_lilysai__create_project, mcp__plugin_lilysai_lilysai__create_note, mcp__plugin_lilysai_lilysai__get_note, mcp__plugin_lilysai_lilysai__get_project, mcp__plugin_lilysai_lilysai__list_projects, mcp__plugin_lilysai_lilysai__get_transcript]
runs: 3
graders:
  - type: tool_used
    name: skill-fires
    tool: Skill
    min: 1
    weight: 1
  - type: tool_used
    name: exactly-one-project
    tool: mcp__plugin_lilysai_lilysai__create_project
    min: 1
    max: 1
    arm: both
    weight: 2
  - type: tool_used
    name: exactly-one-note
    tool: mcp__plugin_lilysai_lilysai__create_note
    min: 1
    max: 1
    arm: both
    weight: 1
  - type: llm
    name: three-sources-in-one-call
    focus: mock_calls
    arm: both
    weight: 2
    criteria: |
      A single create_project call carries all three arxiv URLs in its sources
      array. Three separate create_project calls, or a call that drops one of
      the three URLs, both fail.
